<meta name="claude:viewport-fit-sides" content="cover">
<title>OpenVW</title>
<style>
  /* Layout: fixed app shell — sticky topbar, scrolling view, bottom tab bar. VW-blue identity. */
  :root{
    --ink:#0a1a2f; --ink-soft:#4a5c73; --ink-faint:#8294ab;
    --bg:#eef1f5; --surface:#ffffff; --surface-2:#f6f8fb; --line:#dde3ec;
    --vw:#001e50;           /* VW deep blue */
    --vw-2:#00b1eb;         /* VW petrol / light blue */
    --accent:#00b1eb;
    --good:#1ca672; --warn:#e0952a; --bad:#d6465a;
    --shadow:0 1px 2px rgba(10,26,47,.06), 0 8px 24px -12px rgba(10,26,47,.18);
    --radius:18px;
    --f-display:"Saira",-apple-system,system-ui,sans-serif;
    --f-body:"Manrope",-apple-system,system-ui,sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --ink:#eaf1fb; --ink-soft:#9fb2cc; --ink-faint:#6b7f9c;
    --bg:#070d17; --surface:#0f1826; --surface-2:#131f30; --line:#223247;
    --vw:#eaf1fb; --vw-2:#30c3f5; --accent:#30c3f5;
    --good:#2fce93; --warn:#f0ad4a; --bad:#ff6478;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -16px rgba(0,0,0,.7);
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --ink:#eaf1fb; --ink-soft:#9fb2cc; --ink-faint:#6b7f9c;
    --bg:#070d17; --surface:#0f1826; --surface-2:#131f30; --line:#223247;
    --vw:#eaf1fb; --vw-2:#30c3f5; --accent:#30c3f5;
    --good:#2fce93; --warn:#f0ad4a; --bad:#ff6478;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -16px rgba(0,0,0,.7);
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);
    font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em;font-weight:650}
  button{font-family:inherit;cursor:pointer}
  input,select{font-family:inherit}
  .tnum{font-variant-numeric:tabular-nums}

  /* ---- Shell ---- */
  #app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
    background:var(--bg);position:relative}
  .topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
    background:linear-gradient(180deg,var(--vw) 0%,var(--vw) 60%,color-mix(in srgb,var(--vw) 88%,black) 100%);
    color:#fff;padding-block:12px;
    padding-left:max(18px,env(safe-area-inset-left,0px));
    padding-right:max(18px,env(safe-area-inset-right,0px));
    display:flex;align-items:center;gap:12px;box-shadow:0 6px 20px -12px rgba(0,0,0,.5)}
  :root[data-theme="dark"] .topbar, :root:not([data-theme="light"]) .topbar{color:#eaf1fb}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.01em}
  .roundel{width:34px;height:34px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;
    font-size:13px;font-weight:700;line-height:.82;letter-spacing:-1px}
  .roundel span{display:block;text-align:center}
  .topbar .spacer{flex:1}
  .iconbtn{appearance:none;border:none;background:rgba(255,255,255,.14);color:inherit;width:38px;height:38px;
    border-radius:12px;display:grid;place-items:center;font-size:17px}
  .iconbtn:active{transform:scale(.94)}

  main{flex:1;padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 96px}
  .view{display:flex;flex-direction:column;gap:14px;animation:rise .35s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.view{animation:none}*{transition:none!important}}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .pad{padding:16px}
  .eyebrow{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.14em;font-size:11px;
    font-weight:650;color:var(--ink-faint)}
  .muted{color:var(--ink-soft)}
  .row{display:flex;align-items:center;gap:12px}
  .between{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

  /* ---- Hero vehicle card ---- */
  .hero{position:relative;overflow:hidden;color:#fff;border:none;
    background:radial-gradient(120% 90% at 80% -10%,#0a3a86 0%,var(--vw) 55%,#001233 100%)}
  .hero .pad{padding:18px}
  .hero .plate{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.25);border-radius:9px;padding:4px 9px;font-weight:700;
    letter-spacing:.06em;font-size:13px}
  .hero h2{font-size:26px;line-height:1.05}
  .hero .sub{color:#b9d2f2;font-size:13px;margin-top:2px}
  .carwrap{height:96px;margin:6px -6px 0;display:grid;place-items:center}
  .carwrap svg{height:100%;width:auto;filter:drop-shadow(0 14px 18px rgba(0,0,0,.45))}
  .statuspills{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;
    padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18)}
  .pill.good{background:rgba(44,214,146,.18);border-color:rgba(44,214,146,.4)}
  .pill.warn{background:rgba(224,149,42,.2);border-color:rgba(224,149,42,.45)}
  .pill.bad{background:rgba(214,70,90,.2);border-color:rgba(214,70,90,.45)}
  .dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px rgba(255,255,255,.12)}
  .live{color:#5ef0b0}

  /* ---- Gauges ---- */
  .gauge{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px}
  .gauge svg{width:100%;height:auto;max-width:120px}
  .gauge .val{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1}
  .gauge .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);font-weight:650}
  .gtrack{fill:none;stroke:var(--line);stroke-width:9;stroke-linecap:round}
  .gfill{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .6s ease}

  /* ---- Stat tiles ---- */
  .tile{padding:14px}
  .tile .k{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-faint);font-weight:650}
  .tile .v{font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1.05;margin-top:4px}
  .tile .v small{font-size:13px;font-weight:600;color:var(--ink-soft)}
  .tile .trend{font-size:12px;font-weight:650;margin-top:3px}

  /* quick actions */
  .qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .qa button{display:flex;flex-direction:column;align-items:center;gap:7px;background:var(--surface);
    border:1px solid var(--line);border-radius:16px;padding:13px 6px;color:var(--ink);box-shadow:var(--shadow)}
  .qa button:active{transform:translateY(1px)}
  .qa .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
    background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent)}
  .qa .ic svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .qa span{font-size:11.5px;font-weight:650;color:var(--ink-soft)}

  /* section header */
  .sechead{display:flex;align-items:center;justify-content:space-between;margin:2px 2px -2px}
  .sechead h3{font-size:16px}
  .link{background:none;border:none;color:var(--accent);font-weight:700;font-size:13px;padding:4px}

  /* list rows */
  .list{display:flex;flex-direction:column}
  .item{display:flex;align-items:center;gap:13px;padding:13px 14px;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:none}
  .item .ic{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;
    background:var(--surface-2);color:var(--accent)}
  .item .ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .item .main{flex:1;min-width:0}
  .item .main b{font-weight:700;font-size:14.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .main .s{font-size:12.5px;color:var(--ink-soft)}
  .item .end{text-align:right;flex:none}
  .item .end b{font-family:var(--f-display);font-weight:700}
  .chip{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;
    background:var(--surface-2);color:var(--ink-soft)}
  .chip.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
  .chip.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
  .chip.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}

  /* spec table */
  .spec{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
  .spec:last-child{border-bottom:none}
  .spec span:first-child{color:var(--ink-soft)}
  .spec span:last-child{font-weight:650;text-align:right}

  /* forms */
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
  .field label{font-size:12px;font-weight:650;color:var(--ink-soft);letter-spacing:.02em}
  .field input,.field select{appearance:none;border:1px solid var(--line);background:var(--surface-2);
    color:var(--ink);border-radius:12px;padding:11px 13px;font-size:15px;width:100%}
  .field input:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  .btn{appearance:none;border:none;border-radius:13px;padding:13px 16px;font-weight:700;font-size:15px;width:100%;
    background:var(--vw);color:#fff}
  :root[data-theme="dark"] .btn,:root:not([data-theme="light"]) .btn{background:var(--accent);color:#04121f}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--line)}
  .btn.sm{width:auto;padding:9px 14px;font-size:13.5px;border-radius:11px}

  /* bottom nav */
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:color-mix(in srgb,var(--surface) 92%,transparent);
    backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);
    padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
  nav.tabs .inner{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
  nav.tabs button{background:none;border:none;color:var(--ink-faint);display:flex;flex-direction:column;
    align-items:center;gap:3px;padding:9px 2px 7px;font-size:10.5px;font-weight:650}
  nav.tabs button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  nav.tabs button[aria-current="true"]{color:var(--accent)}
  nav.tabs button[aria-current="true"] .nd{opacity:1}
  .nd{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:0;margin-top:-1px}

  /* sheet / modal */
  .scrim{position:fixed;inset:0;z-index:60;background:rgba(5,10,20,.5);display:flex;align-items:flex-end;
    justify-content:center;animation:fade .2s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{background:var(--surface);width:100%;max-width:640px;border-radius:22px 22px 0 0;
    padding:18px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));
    max-height:86vh;overflow:auto;animation:sheetin .28s cubic-bezier(.2,.8,.2,1)}
  @keyframes sheetin{from{transform:translateY(100%)}to{transform:none}}
  .sheet .grab{width:38px;height:4px;border-radius:999px;background:var(--line);margin:0 auto 14px}
  .sheet h3{font-size:19px;margin-bottom:14px}

  .empty{text-align:center;padding:30px 18px;color:var(--ink-soft)}
  .empty .big{font-size:30px;margin-bottom:8px}
  .toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:70;background:var(--ink);
    color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:650;font-size:13.5px;box-shadow:var(--shadow);
    animation:fade .2s ease}
  .demoflag{font-size:11px;color:var(--ink-faint);font-weight:650}
  .segment{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px}
  .segment button{flex:1;border:none;background:none;padding:8px;border-radius:9px;font-weight:650;font-size:13px;color:var(--ink-soft)}
  .segment button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  .spark{width:100%;height:40px;display:block}

  /* ---- Login / onboarding ---- */
  .login{position:fixed;inset:0;z-index:80;color:#fff;overflow:auto;
    background:radial-gradient(130% 80% at 80% -10%,#0a3a86 0%,var(--vw) 52%,#00102b 100%);
    display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top,0px) + 8vh)
            max(22px,env(safe-area-inset-left,0px))
            calc(env(safe-area-inset-bottom,0px) + 26px)}
  .login .inner{max-width:420px;width:100%;margin:0 auto;display:flex;flex-direction:column;flex:1}
  .login .roundel{width:60px;height:60px;border-width:2.5px;font-size:22px;margin-bottom:22px}
  .login h1{font-size:30px;line-height:1.08;margin-bottom:8px}
  .login .lede{color:#b9d2f2;font-size:15px;margin-bottom:34px;max-width:30ch}
  .login .grow{flex:1}
  .login label{display:block;font-size:12px;font-weight:650;letter-spacing:.04em;color:#9fc0ea;margin-bottom:7px;text-transform:uppercase}
  .phonewrap{display:flex;align-items:stretch;gap:8px}
  .phonewrap .cc{display:flex;align-items:center;padding:0 14px;background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.25);border-radius:13px;font-weight:700;font-size:16px}
  .login input.big{flex:1;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);
    color:#fff;border-radius:13px;padding:15px 16px;font-size:17px;font-weight:650;width:100%;letter-spacing:.02em}
  .login input.big::placeholder{color:#8fb0d8}
  .login input.big:focus{outline:2px solid var(--vw-2);outline-offset:1px;border-color:transparent}
  .otpwrap{display:flex;gap:10px;justify-content:space-between}
  .otpwrap input{width:100%;aspect-ratio:1/1.1;text-align:center;font-family:var(--f-display);
    font-size:26px;font-weight:700;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);
    border-radius:14px;color:#fff;padding:0}
  .otpwrap input:focus{outline:2px solid var(--vw-2);outline-offset:1px;border-color:transparent;background:rgba(255,255,255,.18)}
  .login .cta{appearance:none;border:none;width:100%;background:#fff;color:var(--vw);font-weight:800;
    font-size:16px;padding:16px;border-radius:14px;font-family:var(--f-display);letter-spacing:.01em}
  .login .cta:disabled{opacity:.45}
  .login .cta:active{transform:translateY(1px)}
  .login .textbtn{background:none;border:none;color:#9fc0ea;font-weight:650;font-size:14px;padding:12px;width:100%}
  .login .hint{background:rgba(255,255,255,.09);border:1px dashed rgba(255,255,255,.3);border-radius:12px;
    padding:11px 13px;font-size:13px;color:#cfe0f7;margin-top:16px;text-align:center}
  .login .hint b{color:#fff;letter-spacing:.3em;font-family:var(--f-display)}
  .login .back{background:none;border:none;color:#9fc0ea;font-size:22px;padding:0 0 18px;align-self:flex-start}
  .login .legal{color:#7fa3cf;font-size:11.5px;text-align:center;margin-top:18px;line-height:1.5}
</style>

<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="roundel"><span>V</span><span>W</span></span>
      OpenVW
    </div>
    <div class="spacer"></div>
    <button class="iconbtn" id="themeBtn" aria-label="Toggle theme">◐</button>
    <button class="iconbtn" id="navSettings" aria-label="Settings">⚙</button>
  </header>
  <main id="main"></main>
</div>

<nav class="tabs"><div class="inner" id="tabs"></div></nav>

<script>
/* ============================================================
   OpenVW — personal connected-car client
   Mirrors the My Volkswagen Connect Plus feature set & data model.
   All data is stored locally on this device (localStorage).
   ============================================================ */

const LS = "openvw.v1";
const save = () => { try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){} };
const uid = () => Math.random().toString(36).slice(2,9);
const todayISO = () => new Date().toISOString().slice(0,10);

const DEFAULTS = {
  vehicle: {
    name:"Volkswagen Virtus", variant:"GT Plus 1.5 TSI", year:"2024",
    plate:"AP 00 AB 0000", vin:"MEXXXXXXXXXXXXXXX", color:"Wild Cherry Red",
    fuel:"Petrol", transmission:"7-speed DSG", odometer:18450, demo:true
  },
  fuelPrice: 104.5,       // ₹/L reference
  tankSize: 45,
  fuelLogs: [
    {id:uid(), date:dback(6), odo:17980, litres:38.2, cost:3992, full:true},
    {id:uid(), date:dback(19), odo:17460, litres:35.6, cost:3721, full:true},
    {id:uid(), date:dback(33), odo:16970, litres:39.1, cost:4086, full:true},
  ],
  documents: [
    {id:uid(), type:"Insurance", title:"Comprehensive Policy", provider:"", expiry:dfwd(118)},
    {id:uid(), type:"PUC", title:"Pollution Certificate", provider:"", expiry:dfwd(24)},
    {id:uid(), type:"Registration", title:"RC / Registration", provider:"", expiry:dfwd(1600)},
  ],
  geofences: [
    {id:uid(), name:"Home", radius:300, alerts:true, lat:17.44, lng:78.39},
    {id:uid(), name:"Office", radius:500, alerts:true, lat:17.43, lng:78.38},
  ],
  service: { lastDate:dback(150), lastOdo:12500, intervalKm:15000, intervalDays:365 },
  settings: { units:"metric", theme:"system" },
  session: { loggedIn:false, phone:"", name:"" }
};
function dback(days){const d=new Date();d.setDate(d.getDate()-days);return d.toISOString().slice(0,10);}
function dfwd(days){const d=new Date();d.setDate(d.getDate()+days);return d.toISOString().slice(0,10);}

let state;
try{ state = JSON.parse(localStorage.getItem(LS)) || structuredClone(DEFAULTS); }
catch(e){ state = structuredClone(DEFAULTS); }
// backfill new keys
for(const k in DEFAULTS){ if(!(k in state)) state[k]=structuredClone(DEFAULTS[k]); }

/* ---- Live telemetry (real Cerence OBD via the local bridge) ---- */
const telemetry = {
  fuelPct: 64, speed:0, engineSpeed:0, coolant:88, voltage:12.4,
  moving:false, locked:true, doors:"closed", lat:17.4401, lng:78.3912, heading:112,
  engineOn:false, milOn:false, engineLoad:0, intakeTemp:0, live:false,
};
function applyTelemetry(t){
  if(!t) return;
  if(t.fuelPct!=null) telemetry.fuelPct=t.fuelPct;
  if(t.speed!=null) telemetry.speed=t.speed;
  if(t.engineSpeed!=null) telemetry.engineSpeed=t.engineSpeed;
  if(t.coolant!=null) telemetry.coolant=t.coolant;
  if(t.voltage!=null) telemetry.voltage=t.voltage;
  telemetry.moving=(t.speed||0)>0;
  telemetry.engineOn=(t.engine==="ON"||t.engine===true);
  if(t.milOn!=null) telemetry.milOn=t.milOn;
  if(t.engineLoad!=null) telemetry.engineLoad=t.engineLoad;
  if(t.intakeTemp!=null) telemetry.intakeTemp=t.intakeTemp;
  if(t.odometer && state.vehicle) state.vehicle.odometer=t.odometer;
  telemetry.live=true;
}
async function tick(){
  if(!state.vehicle || state.vehicle.demo){
    // gentle idle drift so the demo dashboard feels alive
    telemetry.coolant = 86 + Math.round(Math.sin(Date.now()/9000)*4);
    telemetry.voltage = +(12.3 + Math.sin(Date.now()/7000)*0.25).toFixed(1);
  } else {
    try{ const r=await fetch("/api/telematics").then(r=>r.json()); applyTelemetry(r.telemetry); }catch(e){}
  }
  if(curTab==="home") paintLive();
}
setInterval(tick, 10000);
function applyLiveData(d){
  if(d.vehicle){ state.vehicle=Object.assign({}, state.vehicle, d.vehicle); state.vehicle.demo=false; }
  if(d.telemetry) applyTelemetry(d.telemetry);
  if(d.profile && d.profile.name) state.session.name=d.profile.name;
  if(d.docs){
    const map={Insurance:d.docs.insuranceExpiry, PUC:d.docs.pucExpiry, Registration:null};
    (state.documents||[]).forEach(doc=>{ if(map[doc.type]) doc.expiry=String(map[doc.type]).slice(0,10); });
  }
  save();
}

/* ---------- helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const el = (tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;};
const fmt = n => n.toLocaleString("en-IN");
const money = n => "₹"+Math.round(n).toLocaleString("en-IN");
const daysBetween = (a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
function fmtDate(iso){const d=new Date(iso);return d.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});}
function relDate(iso){const n=daysBetween(todayISO(),iso); if(n===0)return"Today"; if(n===1)return"Tomorrow"; if(n===-1)return"Yesterday";
  return n>0?`in ${n} days`:`${-n} days ago`;}

function toast(msg){const t=el("div","toast",msg);document.body.appendChild(t);setTimeout(()=>t.remove(),1900);}

/* ---------- derived fuel analytics ---------- */
function mileageSeries(){
  const logs=[...state.fuelLogs].sort((a,b)=>a.odo-b.odo);
  const out=[];
  for(let i=1;i<logs.length;i++){
    if(logs[i].full && logs[i-1].full){
      const km=logs[i].odo-logs[i-1].odo;
      if(km>0) out.push({date:logs[i].date, kmpl:+(km/logs[i].litres).toFixed(1), km});
    }
  }
  return out;
}
function fuelStats(){
  const s=mileageSeries();
  const avg = s.length? s.reduce((a,b)=>a+b.kmpl,0)/s.length : null;
  const totalSpent = state.fuelLogs.reduce((a,b)=>a+(+b.cost||0),0);
  const totalL = state.fuelLogs.reduce((a,b)=>a+(+b.litres||0),0);
  return {avg, totalSpent, totalL, series:s, last:s[s.length-1]};
}

/* ============================================================
   Gauge component
   ============================================================ */
function gauge(label, value, display, pct, color){
  const r=42, c=2*Math.PI*r, len=c*0.75; // 270° arc
  const off = len*(1-Math.max(0,Math.min(1,pct)));
  return `<div class="gauge">
    <svg viewBox="0 0 110 110">
      <circle class="gtrack" cx="55" cy="55" r="${r}"
        stroke-dasharray="${len} ${c}" transform="rotate(135 55 55)"/>
      <circle class="gfill" cx="55" cy="55" r="${r}" style="stroke:${color}"
        stroke-dasharray="${len} ${c}" stroke-dashoffset="${off}" transform="rotate(135 55 55)"/>
      <text x="55" y="52" text-anchor="middle" class="val" fill="var(--ink)"
        style="font-family:var(--f-display);font-weight:700;font-size:19px">${display}</text>
      <text x="55" y="68" text-anchor="middle" fill="var(--ink-faint)"
        style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:650">${label}</text>
    </svg>
  </div>`;
}

function sparkline(vals){
  if(vals.length<2) return "";
  const w=300,h=40,max=Math.max(...vals),min=Math.min(...vals),rng=(max-min)||1;
  const pts=vals.map((v,i)=>[i/(vals.length-1)*w, h-4-((v-min)/rng)*(h-10)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=`M0 ${h} `+pts.map(p=>'L'+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')+` L${w} ${h} Z`;
  const last=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <path d="${area}" fill="var(--accent)" opacity=".12"/>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.4" fill="var(--accent)"/>
  </svg>`;
}

  return w;
}
function emptyState(ic,t,s){const e=el("div","empty");
  e.innerHTML=`<div class="big">${svg(ic,'')}</div><b>${t}</b><div class="s" style="margin-top:4px">${s}</div>`;
  e.querySelector("svg").style.cssText="width:40px;height:40px;stroke:var(--ink-faint);fill:none;stroke-width:1.6;margin:0 auto";
  return e;}

function serviceStatus(){
  const s=state.service;
  const dueDate=dfwdFrom(s.lastDate,s.intervalDays);
  const dueOdo=s.lastOdo+s.intervalKm;
  const daysLeft=daysBetween(todayISO(),dueDate);
  const kmLeft=dueOdo-state.vehicle.odometer;
  const near = daysLeft<30 || kmLeft<1000;
  const over = daysLeft<0 || kmLeft<0;
  return {
    text:`${fmtDate(dueDate)} · or ${fmt(Math.max(0,kmLeft))} km`,
    badge: over?'Overdue':near?'Soon':'OK',
    cls: over?'bad':near?'warn':'good'
  };
}
function dfwdFrom(iso,days){const d=new Date(iso);d.setDate(d.getDate()+days);return d.toISOString().slice(0,10);}

/* deterministic demo trips */
function recentTrips(){
  const places=[["Home","Office"],["Office","Home"],["Home","Airport"],["Mall","Home"],
    ["Office","Gym"],["Home","Lake View"],["Service Centre","Home"],["Home","Market"]];
  const out=[]; let seed=42;
  for(let i=0;i<8;i++){
    seed=(seed*1103515245+12345)&0x7fffffff; const rnd=seed/0x7fffffff;
    const [from,to]=places[i%places.length];
    const km=Math.round(4+rnd*46);
    const avg=Math.round(26+rnd*22);
    const mins=Math.round(km/avg*60);
    out.push({from,to,km,avg,dur:(mins>=60?`${Math.floor(mins/60)}h ${mins%60}m`:`${mins} min`),date:dback(i*2+1)});
  }
  return out;
}

function sheet(title, bodyHTML, onMount){
  const scrim=el("div","scrim"); const s=el("div","sheet");
  s.innerHTML=`<div class="grab"></div><h3>${title}</h3>`+bodyHTML;
  scrim.appendChild(s); document.body.appendChild(scrim);
  scrim.addEventListener("click",e=>{ if(e.target===scrim) scrim.remove(); });
  if(onMount) onMount(s, ()=>scrim.remove());
  return {s, close:()=>scrim.remove()};
}
function fieldHTML(id,label,val="",type="text",extra=""){
  return `<div class="field"><label for="${id}">${label}</label>
    <input id="${id}" type="${type}" value="${val==null?'':String(val).replace(/"/g,'&quot;')}" ${extra}></div>`;
}
function selectHTML(id,label,opts,val){
  return `<div class="field"><label for="${id}">${label}</label><select id="${id}">`+
    opts.map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join("")+`</select></div>`;
}

/* ============================================================
   Login / onboarding  (mirrors the app's mobile-OTP sign-in)
   Runs locally — the OTP is generated on-device, not sent by SMS.
   ============================================================ */
let pendingOTP="", pendingPhone="";
function chrome(show){
  document.querySelector(".topbar").hidden=!show;
  document.querySelector("nav.tabs").hidden=!show;
  $("#main").hidden=!show;
}
function showLogin(){
  chrome(false);
  const old=$("#loginScreen"); if(old) old.remove();
  const scr=el("div","login"); scr.id="loginScreen";
  scr.innerHTML=`<div class="inner">
    <span class="roundel"><span>V</span><span>W</span></span>
    <h1>Welcome to<br>OpenVW</h1>
    <div class="lede">Sign in with your mobile number to connect your Volkswagen.</div>
    <div class="grow"></div>
    <div id="loginStep"></div>
  </div>`;
  document.body.appendChild(scr);
  stepPhone();
}
function stepPhone(){
  const c=$("#loginStep");
  c.innerHTML=`
    <label for="lg_phone">Mobile number</label>
    <div class="phonewrap">
      <span class="cc">+91</span>
      <input class="big" id="lg_phone" type="tel" inputmode="numeric" maxlength="10"
        placeholder="00000 00000" value="${state.session.phone||''}" autocomplete="tel-national">
    </div>
    <button class="cta" id="lg_go" style="margin-top:20px">Send OTP</button>
    <div class="legal">By continuing you agree this personal client stores your data only on this device.</div>`;
  const inp=$("#lg_phone"), go=$("#lg_go");
  const check=()=>{go.disabled=inp.value.replace(/\D/g,"").length!==10;};
  inp.oninput=()=>{inp.value=inp.value.replace(/\D/g,"").slice(0,10);check();};
  check(); inp.focus();
  go.onclick=async ()=>{
    pendingPhone=inp.value.replace(/\D/g,"");
    go.disabled=true; go.textContent="Sending OTP…";
    try{
      const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({phone:pendingPhone})}).then(r=>r.json());
      if(!r.ok){ toast(r.message||"Couldn't send OTP"); go.disabled=false; go.textContent="Send OTP"; return; }
      stepOTP();
    }catch(e){ toast("Bridge offline — start it with: node server.js"); go.disabled=false; go.textContent="Send OTP"; }
  };
}
function stepOTP(){
  const c=$("#loginStep");
  c.innerHTML=`
    <button class="back" id="lg_back" aria-label="Back">←</button>
    <label>Enter the 6-digit code</label>
    <div class="lede" style="margin:-4px 0 18px">Sent to +91 ${pendingPhone.replace(/(\d{5})(\d{5})/,"$1 $2")}</div>
    <div class="otpwrap">
      ${[0,1,2,3,4,5].map(i=>`<input id="otp${i}" type="tel" inputmode="numeric" maxlength="1" aria-label="digit ${i+1}">`).join("")}
    </div>
    <button class="cta" id="lg_verify" style="margin-top:22px" disabled>Verify & continue</button>
    <button class="textbtn" id="lg_resend">Resend code</button>
    <div class="hint">Enter the 6-digit code sent to your phone by SMS.</div>`;
  const boxes=[0,1,2,3,4,5].map(i=>$("#otp"+i));
  const verify=$("#lg_verify");
  const read=()=>boxes.map(b=>b.value).join("");
  const check=()=>{verify.disabled=read().length!==6;};
  let busy=false;
  boxes.forEach((b,i)=>{
    b.oninput=()=>{b.value=b.value.replace(/\D/g,"").slice(0,1);
      if(b.value&&i<5)boxes[i+1].focus(); check();
      if(read().length===6) doVerify();};
    b.onkeydown=e=>{if(e.key==="Backspace"&&!b.value&&i>0)boxes[i-1].focus();};
    b.onpaste=e=>{const d=(e.clipboardData.getData("text")||"").replace(/\D/g,"").slice(0,6);
      if(d){e.preventDefault();[...d].forEach((ch,j)=>{if(boxes[j])boxes[j].value=ch;});check();if(d.length===6)doVerify();}};
  });
  boxes[0].focus();
  $("#lg_back").onclick=stepPhone;
  $("#lg_resend").onclick=async ()=>{
    try{ await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone:pendingPhone})}); toast("Code re-sent"); }
    catch(e){ toast("Bridge offline"); }
  };
  verify.onclick=doVerify;
  async function doVerify(){
    if(busy||read().length!==6) return; busy=true;
    verify.disabled=true; verify.textContent="Verifying…";
    try{
      const r=await fetch("/api/verify",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({otp:read()})}).then(r=>r.json());
      if(!r.ok){ boxes.forEach(b=>b.value=""); boxes[0].focus(); busy=false; verify.textContent="Verify & continue"; toast(r.message||"Incorrect code — try again"); return; }
      applyLiveData(r);
      state.session={loggedIn:true, phone:pendingPhone, name:(r.profile&&r.profile.name)||state.session.name||""};
      save();
      const scr=$("#loginScreen");
      if(scr){scr.style.transition="opacity .35s ease";scr.style.opacity="0";setTimeout(()=>scr.remove(),350);}
      startApp();
      toast("Connected to your Volkswagen 🚗");
    }catch(e){ busy=false; verify.disabled=false; verify.textContent="Verify & continue"; toast("Bridge offline"); }
  }
}
function logout(){
  state.session={loggedIn:false, phone:state.session.phone, name:""};
  save(); curTab="home"; showLogin();
}

function startApp(){
  chrome(true);
  render();
  // refresh live profile/vehicle/telemetry in the background
  if(state.vehicle && !state.vehicle.demo){
    fetch("/api/data").then(r=>r.json()).then(d=>{
      if(d && d.vehicle){ applyLiveData(d); render(); }
    }).catch(()=>{});
  }
}

/* boot */
applyTheme();
buildTabs();
// honor a deep-link hash (#fuel etc.)
if(location.hash){const h=location.hash.slice(1); if(TABS.some(t=>t.id===h)) curTab=h;}
if(state.session && state.session.loggedIn){ startApp(); }
else { showLogin(); }
</script>
